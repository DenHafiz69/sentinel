<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="color-scheme" content="dark">
<title>Sentinel</title>
<link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials">
<meta name="theme-color" content="#0e0f11">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sentinel">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='46' fill='%232b5278'/%3E%3Ctext x='50' y='66' font-size='52' text-anchor='middle' fill='white' font-family='system-ui'%3ES%3C/text%3E%3C/svg%3E">
<style>
:root{
  --bg:#0e0f11; --side:#17181b; --side2:#1d1f23; --bubble-a:#212327; --bubble-u:#2b5278;
  --txt:#e8eaed; --dim:#8a8f98; --line:#26282d; --accent:#6ab3f3; --err:#c0392b; --ok:#2ecc71;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;height:100dvh;overscroll-behavior:none;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--txt);overflow:hidden}
#app{display:flex;width:100%;height:100%;height:100dvh}
/* sidebar */
#sidebar{width:296px;background:var(--side);display:flex;flex-direction:column;border-right:1px solid var(--line);flex-shrink:0;transition:transform .22s ease;padding-top:env(safe-area-inset-top);padding-left:env(safe-area-inset-left);overscroll-behavior:contain}
#backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:4}
#backdrop.show{display:block}
.sidehead{padding:12px 12px 8px;display:flex;flex-direction:column;gap:8px}
#newbtn{width:100%;padding:10px 14px;border:none;border-radius:10px;background:var(--accent);color:#08141f;font-weight:600;font-size:14px;cursor:pointer}
#newbtn:hover{filter:brightness(1.1)}
.side-tools{display:flex;gap:6px;align-items:center}
#searchbtn{flex:1;display:flex;align-items:center;justify-content:space-between;background:var(--side2);border:1px solid var(--line);border-radius:8px;color:var(--dim);padding:6px 10px;font-size:12.5px;cursor:pointer}
#searchbtn:hover{border-color:var(--accent);color:var(--txt)}
#searchbtn kbd{font:11px ui-monospace,monospace;background:#0e0f11;border:1px solid var(--line);border-radius:4px;padding:1px 5px;color:var(--dim)}
#sortbtn{background:var(--side2);border:1px solid var(--line);border-radius:8px;color:var(--dim);padding:6px 9px;font-size:12px;cursor:pointer;white-space:nowrap}
#sortbtn:hover{border-color:var(--accent);color:var(--txt)}
#threads{flex:1;overflow-y:auto;padding:4px 8px}
.thread{position:relative;display:flex;align-items:center;gap:6px;padding:9px 10px;border-radius:10px;cursor:pointer;margin-bottom:2px}
.thread:hover,.thread.active{background:var(--side2)}
.thread-main{flex:1;min-width:0}
.thread .tt{font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:5px}
.thread.active .tt{color:white;font-weight:600}
.thread .pin-ic{font-size:11px;flex-shrink:0}
.thread .ts{font-size:11px;color:var(--dim);margin-top:2px}
.thread-act{opacity:0;background:none;border:none;color:var(--dim);cursor:pointer;padding:2px 6px;border-radius:6px;font-size:15px;line-height:1;flex-shrink:0}
.thread:hover .thread-act,.thread.active .thread-act,.thread-act.open{opacity:1}
.thread-act:hover{background:#2a2d33;color:var(--txt)}
.tmenu{position:fixed;z-index:30;background:var(--side2);border:1px solid var(--line);border-radius:10px;padding:4px;min-width:150px;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.tmenu button{display:block;width:100%;text-align:left;background:none;border:none;color:var(--txt);padding:7px 10px;border-radius:7px;font-size:13px;cursor:pointer}
.tmenu button:hover{background:#2a2d33}
.tmenu button.danger{color:#ff7b6b}
.arch-hdr{display:flex;align-items:center;justify-content:space-between;padding:8px 10px 4px;font-size:11.5px;color:var(--dim);cursor:pointer;user-select:none}
.arch-hdr:hover{color:var(--txt)}
#me{display:flex;align-items:center;gap:8px;padding:10px 12px max(10px,env(safe-area-inset-bottom));border-top:1px solid var(--line);font-size:12px;color:var(--dim)}
#me-txt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#ver-badge{font:11px ui-monospace,monospace;background:var(--side2);border:1px solid var(--line);border-radius:6px;padding:2px 6px;color:var(--dim);cursor:pointer;flex-shrink:0}
#ver-badge:hover{border-color:var(--accent);color:var(--txt)}
#settings-btn{background:var(--side2);border:1px solid var(--line);border-radius:8px;color:var(--txt);padding:5px 8px;font-size:13px;cursor:pointer;flex-shrink:0}
#settings-btn:hover{border-color:var(--accent)}
/* settings & changelog */
.stabs{display:flex;gap:4px;padding:8px 14px;border-bottom:1px solid var(--line);overflow-x:auto}
.stab{background:none;border:1px solid transparent;color:var(--dim);padding:6px 10px;border-radius:8px;font-size:12.5px;cursor:pointer;white-space:nowrap}
.stab:hover{color:var(--txt)}
.stab.active{background:var(--side2);border-color:var(--line);color:var(--txt);font-weight:600}
.srow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.srow:last-child{border-bottom:none}
.srow label{display:flex;flex-direction:column;gap:2px}
.srow .sdesc{font-size:11.5px;color:var(--dim)}
.srow select{background:var(--side2);border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:6px 8px;font-size:12.5px}
.cl-entry{padding:10px 0;border-bottom:1px solid var(--line)}
.cl-entry:last-child{border-bottom:none}
.cl-hdr{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.cl-ver{font:12px ui-monospace,monospace;background:rgba(106,179,243,.15);color:var(--accent);padding:2px 7px;border-radius:6px;font-weight:600}
.cl-date{font-size:11.5px;color:var(--dim);margin-left:auto}
.cl-title{font-size:13.5px;font-weight:600;margin-bottom:4px}
.cl-list{padding-left:18px;font-size:13px;color:#c7ccd4;line-height:1.55}
/* main */
main{flex:1;display:flex;flex-direction:column;min-width:0;position:relative}
header{display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) calc(18px + env(safe-area-inset-right)) 10px calc(18px + env(safe-area-inset-left));border-bottom:1px solid var(--line);background:var(--bg)}
#burger{display:none;background:none;border:none;color:var(--txt);font-size:20px;cursor:pointer;min-width:36px;min-height:36px}
header h1{font-size:16px;font-weight:600}
#status{font-size:12px;color:var(--dim)}
#status.busy{color:var(--accent)}
#elapsed{font-size:12px;color:var(--dim);margin-left:6px}
.hdr-right{margin-left:auto;display:flex;align-items:center;gap:8px}
#hdr-search,#hdr-settings{display:none;background:var(--side2);color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:14px;cursor:pointer;min-height:36px}
#model-pill{background:var(--side2);color:var(--dim);border:1px solid var(--line);border-radius:8px;padding:5px 10px;font-size:12px;cursor:pointer;max-width:180px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#model-pill:hover{border-color:var(--accent);color:var(--txt)}
.model-opt{display:flex;align-items:center;justify-content:space-between;width:100%;text-align:left;background:var(--side2);border:1px solid var(--line);color:var(--txt);padding:9px 12px;border-radius:9px;font-size:13px;cursor:pointer;margin-bottom:6px}
.model-opt:hover,.model-opt.active{border-color:var(--accent)}
.model-opt.active{background:rgba(106,179,243,.12)}
#stopbtn{background:var(--side2);color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:6px 12px;font-size:12px;cursor:pointer;min-height:34px}
#stopbtn:hover{border-color:var(--err);color:#ff8f7a}
/* messages */
#msgs{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:18px clamp(16px,4vw,48px) 10px;scroll-behavior:smooth}
.msg{display:flex;margin:4px 0;transition:background .3s}
.msg.user{justify-content:flex-end}
.msg.jump-hit .bubble{outline:2px solid var(--accent);box-shadow:0 0 0 4px rgba(106,179,243,.2)}
.msg .bubble{max-width:min(860px,78%);padding:9px 13px;border-radius:14px;background:var(--bubble-a);word-wrap:break-word;overflow-wrap:anywhere}
.msg.user .bubble{background:var(--bubble-u);border-bottom-right-radius:4px}
.msg.assistant .bubble{border-bottom-left-radius:4px}
.msg.error .bubble{background:rgba(192,57,43,.15);border:1px solid rgba(192,57,43,.4)}
.msg .time{font-size:10.5px;color:rgba(255,255,255,.45);margin-top:4px;text-align:right}
.msg-foot{display:flex;align-items:center;justify-content:flex-end;gap:8px;margin-top:4px}
.msg-acts{display:flex;gap:4px;opacity:0;transition:opacity .15s}
.msg:hover .msg-acts,.msg:focus-within .msg-acts,.msg.error .msg-acts{opacity:1}
.msg-act-btn{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);color:var(--dim);border-radius:6px;padding:2px 7px;font-size:11px;cursor:pointer}
.msg-act-btn:hover{color:var(--txt);border-color:var(--accent)}
.msg-act-btn.retry{color:#ffb3a7;border-color:rgba(192,57,43,.45)}
main.drop-active::after{content:"Drop files to attach";position:absolute;inset:12px;border:2px dashed var(--accent);border-radius:14px;background:rgba(14,15,17,.82);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:600;color:var(--accent);z-index:25;pointer-events:none}
.bubble .h{font-weight:700;margin:8px 0 3px}
.bubble .li{margin:2px 0 2px 6px}
.bubble a{color:var(--accent)}
.bubble code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;background:#0b0c0e;padding:1px 5px;border-radius:5px}
/* code blocks */
.codeblock{background:#0b0c0e;border:1px solid var(--line);border-radius:10px;margin:8px 0;overflow:hidden}
.codehdr{display:flex;align-items:center;justify-content:space-between;padding:6px 10px;background:#131518;border-bottom:1px solid var(--line);font-size:11.5px;color:var(--dim)}
.codelang{font-family:ui-monospace,monospace;text-transform:lowercase;color:#aab2bd}
.codebtns{display:flex;gap:6px}
.codebtn{background:var(--side2);border:1px solid var(--line);border-radius:6px;color:var(--dim);padding:2px 8px;font-size:11px;cursor:pointer}
.codebtn:hover{border-color:var(--accent);color:var(--txt)}
.codebody{display:flex;overflow-x:auto;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;line-height:1.5}
.codeln{user-select:none;padding:9px 10px;text-align:right;color:#4f5560;border-right:1px solid #1b1d22;background:#0d0e11;flex-shrink:0}
.codebody pre{margin:0;padding:9px 12px;background:none;border:none;overflow:visible;flex:1;white-space:pre}
.codebody pre code{background:none;padding:0;font-size:inherit;white-space:pre}
.tok-kw{color:#c792ea}
.tok-str{color:#c3e88d}
.tok-num{color:#f78c6c}
.tok-cmt{color:#676e95;font-style:italic}
/* attachments */
.att-img{display:block;max-width:300px;max-height:300px;border-radius:9px;margin:6px 0}
.att-video{display:block;max-width:min(360px,100%);max-height:280px;border-radius:9px;margin:6px 0;background:#000}
.att-audio{display:block;width:min(320px,100%);margin:6px 0}
.att-file{display:flex;align-items:center;gap:9px;background:#0b0c0e;border:1px solid var(--line);border-radius:9px;padding:9px 12px;margin:6px 0;color:var(--txt);text-decoration:none;max-width:320px}
.att-file:hover{border-color:var(--accent)}
.att-file .fname{flex:1;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.att-file .fsize{font-size:11px;color:var(--dim)}
.cursor{display:inline-block;width:8px;height:15px;background:var(--accent);margin-left:2px;vertical-align:-2px;animation:blink 1s steps(1) infinite;border-radius:2px}
@keyframes blink{50%{opacity:0}}
#empty{padding:60px 20px;text-align:center;color:var(--dim);font-size:14px;line-height:1.8}
#empty b{color:var(--txt)}
/* activity panel */
#activity-panel{margin:0 clamp(16px,4vw,48px) 6px;background:var(--side);border:1px solid var(--line);border-radius:10px;font-size:12.5px;overflow:hidden}
#activity-panel[hidden]{display:none}
.act-head{display:flex;align-items:center;gap:8px;padding:7px 11px;cursor:pointer;user-select:none}
.act-head:hover{background:var(--side2)}
.act-dot{width:8px;height:8px;border-radius:50%;background:var(--accent);animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.act-title{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.act-toggle{color:var(--dim);font-size:11px}
.act-list{border-top:1px solid var(--line);max-height:180px;overflow-y:auto;padding:4px 8px}
.act-item{display:flex;align-items:flex-start;gap:8px;padding:5px 4px;border-bottom:1px solid rgba(255,255,255,.04)}
.act-item:last-child{border-bottom:none}
.act-ic{width:16px;text-align:center;flex-shrink:0;font-size:12px}
.act-ic.run{color:var(--accent)}
.act-ic.done{color:var(--ok)}
.act-ic.err{color:#ff7b6b}
.act-body{flex:1;min-width:0}
.act-name{font-weight:600;color:var(--txt)}
.act-detail{color:var(--dim);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.act-err{color:#ff8f7a;font-size:11.5px;margin-top:2px}
.act-dur{color:var(--dim);font-size:11px;flex-shrink:0}
.msg-act{margin-top:6px;border-top:1px solid rgba(255,255,255,.07);padding-top:5px;font-size:12px}
.msg-act summary{cursor:pointer;color:var(--dim);user-select:none}
.msg-act summary:hover{color:var(--txt)}
/* composer + slash popup */
#composer{padding:8px clamp(16px,4vw,48px) max(14px,env(safe-area-inset-bottom));position:relative}
#cmd-popup{position:absolute;left:clamp(16px,4vw,48px);right:clamp(16px,4vw,48px);bottom:100%;margin-bottom:4px;background:var(--side);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 28px rgba(0,0,0,.55);max-height:260px;overflow-y:auto;z-index:20;padding:4px}
#cmd-popup[hidden]{display:none}
.cmd-item{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 12px;border-radius:8px;cursor:pointer}
.cmd-item:hover,.cmd-item.sel{background:var(--side2)}
.cmd-left{display:flex;align-items:center;gap:10px;min-width:0}
.cmd-usage{font-family:ui-monospace,monospace;font-size:13px;color:var(--accent);font-weight:600;white-space:nowrap}
.cmd-desc{font-size:12.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}
.chip{display:flex;align-items:center;gap:8px;background:var(--side2);border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:13px;max-width:260px}
.chip img{width:34px;height:34px;object-fit:cover;border-radius:6px}
.chip .cn{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip button{background:none;border:none;color:var(--dim);cursor:pointer;font-size:15px}
.row{display:flex;align-items:flex-end;gap:8px}
#attach{background:var(--side2);border:1px solid var(--line);border-radius:12px;color:var(--txt);width:42px;height:42px;font-size:17px;cursor:pointer;flex-shrink:0}
#attach:hover{border-color:var(--accent)}
#input{flex:1;resize:none;border:1px solid var(--line);background:var(--side2);color:var(--txt);border-radius:12px;padding:10px 14px;font:inherit;line-height:1.35;min-height:44px;max-height:160px;overflow-y:auto;outline:none}
#input::placeholder{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#input:focus{border-color:#3a3f47}
.mobile-only{display:none}
@media(max-width:760px),(hover:none) and (pointer:coarse){
  .desktop-only{display:none !important}
  .mobile-only{display:inline}
}
#send{background:var(--accent);border:none;border-radius:12px;color:#08141f;width:42px;height:42px;font-size:17px;cursor:pointer;flex-shrink:0}
#send:hover{filter:brightness(1.1)}
/* modals */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:40;display:flex;align-items:flex-start;justify-content:center;padding:8vh 16px}
.modal-bg[hidden]{display:none}
.modal{width:100%;max-width:560px;background:var(--side);border:1px solid var(--line);border-radius:14px;box-shadow:0 16px 40px rgba(0,0,0,.6);overflow:hidden}
.modal-hdr{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.modal-hdr h2{font-size:15px;font-weight:600;flex:1}
.modal-close{background:none;border:none;color:var(--dim);font-size:18px;cursor:pointer;padding:2px 6px}
.modal-close:hover{color:var(--txt)}
.modal-body{padding:12px 14px;max-height:60vh;overflow-y:auto;overscroll-behavior:contain;overscroll-behavior-y:contain}
#search-in{width:100%;background:var(--side2);border:1px solid var(--line);border-radius:10px;color:var(--txt);padding:10px 12px;font:inherit;outline:none}
#search-in:focus{border-color:var(--accent)}
#prompt-in,#model-custom{width:100%;background:var(--side2);border:1px solid var(--line);border-radius:10px;color:var(--txt);padding:10px 12px;font:inherit;outline:none}
#model-custom{flex:1;width:auto;min-width:0;border-radius:8px;padding:8px 10px}
#prompt-in:focus,#model-custom:focus{border-color:var(--accent)}
#search-res{margin-top:10px;display:flex;flex-direction:column;gap:4px}
.shit{padding:9px 11px;border-radius:9px;cursor:pointer;border:1px solid transparent}
.shit:hover{background:var(--side2);border-color:var(--line)}
.shit-top{display:flex;justify-content:space-between;font-size:12px;color:var(--dim);margin-bottom:3px}
.shit-title{color:var(--txt);font-weight:600}
.shit-snip{font-size:13px;color:#c7ccd4;line-height:1.4}
.shit-snip mark,.shit-title mark{background:rgba(106,179,243,.28);color:#fff;border-radius:3px;padding:0 2px}
.help-row{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.help-row:last-child{border-bottom:none}
.confirm-btns{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
.btn{background:var(--side2);border:1px solid var(--line);border-radius:8px;color:var(--txt);padding:7px 14px;font-size:13px;cursor:pointer}
.btn.primary{background:var(--accent);color:#08141f;border-color:var(--accent);font-weight:600}
.btn.danger{background:var(--err);border-color:var(--err);color:#fff;font-weight:600}
#toast{position:fixed;top:14px;left:50%;transform:translateX(-50%) translateY(-70px);background:var(--side2);border:1px solid var(--line);border-radius:10px;padding:10px 18px;font-size:13.5px;transition:transform .25s;z-index:50;max-width:90vw}
#toast.show{transform:translateX(-50%) translateY(0)}
/* touch devices: no hover, no hardware keyboard, no drag-and-drop */
@media (pointer:coarse){
  #app{height:var(--app-h,100dvh)}
  #searchbtn kbd{display:none}
  .msg-acts,.thread-act{opacity:1}
  .thread{min-height:46px}
  /* 44px is the smallest comfortable touch target; secondary chrome may be 32-40 */
  #newbtn,#searchbtn,#sortbtn,#stopbtn,#settings-btn{min-height:44px}
  #settings-btn{min-width:44px}
  #model-pill{min-height:40px}
  #ver-badge{min-height:32px;display:inline-flex;align-items:center}
  #burger,#hdr-search,#hdr-settings{min-width:44px;min-height:44px}
  .thread-act{min-width:44px;min-height:44px}
  .modal-close{min-width:44px;min-height:44px;font-size:20px;display:inline-flex;align-items:center;justify-content:center}
  .stab{min-height:44px}
  .arch-hdr{min-height:44px}
  .srow select{min-height:44px}
  .btn{padding:9px 16px;min-height:44px}
  .codebtn{padding:7px 10px;font-size:12px;min-height:32px}
  .msg-act-btn{padding:7px 11px;font-size:12px;min-height:36px}
  .chip button{min-width:32px;min-height:32px;font-size:17px}
  #input,#search-in,#prompt-in,#model-custom{font-size:16px}
  main.drop-active::after{display:none}
  /* a tap that scrolls must not leave a highlighted row behind */
  .thread:active,.tmenu button:active,.cmd-item:active{background:#2a2d33}
}
/* phones held sideways: vertical room is the scarce resource */
@media (pointer:coarse) and (max-height:520px){
  header{padding-top:calc(4px + env(safe-area-inset-top));padding-bottom:4px}

}
@media(max-width:860px){
  #sidebar{position:fixed;z-index:10;height:100%;height:100dvh;width:min(84vw,310px);transform:translateX(-105%);visibility:hidden;box-shadow:0 0 40px rgba(0,0,0,.6)}

  .hdr-right{gap:6px;flex:0 0 auto}
  /* while a reply runs the top bar needs room for Stop: search/settings live in the drawer too */
  body.is-running #hdr-search,body.is-running #hdr-settings{display:none}
  /* min-heights on these live in the pointer:coarse block; keep only sizing here
     so a phone gets the 44px targets instead of these desktop-leaning values */
  #model-pill{max-width:88px;padding:6px 8px;font-size:11.5px}
  #hdr-search,#hdr-settings{padding:6px}

  .att-file{max-width:100%}
  #empty{padding:40px 14px;font-size:13.5px;line-height:1.7}
  #activity-panel{margin-left:max(12px,env(safe-area-inset-left));margin-right:max(12px,env(safe-area-inset-right));margin-bottom:4px}
  .act-list{max-height:120px}
  #composer{padding:6px max(12px,env(safe-area-inset-right)) max(8px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left))}
  #cmd-popup{left:max(12px,env(safe-area-inset-left));right:max(12px,env(safe-area-inset-right));max-height:min(45dvh,260px)}
  .cmd-item{padding:9px 10px}
  .chip{max-width:100%}
  #attach,#send{width:44px;height:44px}
  #toast{top:calc(10px + env(safe-area-inset-top));font-size:13px;padding:9px 14px}
  /* long modals become full-screen sheets */
  #help-modal,#search-modal,#settings-modal,#whatsnew-modal,#model-modal{padding:0;align-items:stretch}
  #help-modal .modal,#search-modal .modal,#settings-modal .modal,#whatsnew-modal .modal,#model-modal .modal{max-width:none;height:100%;max-height:100dvh;border-radius:0;display:flex;flex-direction:column}
  #help-modal .modal-hdr,#search-modal .modal-hdr,#settings-modal .modal-hdr,#whatsnew-modal .modal-hdr,#model-modal .modal-hdr{padding-top:calc(10px + env(safe-area-inset-top))}
  #help-modal .modal-body,#search-modal .modal-body,#settings-modal .modal-body,#whatsnew-modal .modal-body,#model-modal .modal-body{flex:1;min-height:0;max-height:none;padding-bottom:max(14px,env(safe-area-inset-bottom))}

}

<div id="toast"></div>
<script>
const $ = s => document.querySelector(s);
const isTouch = matchMedia('(hover:none) and (pointer:coarse)').matches;
const hasKeyboard = !isTouch || matchMedia('(any-pointer:fine)').matches; // phones report no fine pointer; touch laptops still do
const isNarrow = () => innerWidth <= 860;
const msgs = $('#msgs');
let S = {threads:[], active:null, running:false, runningThread:null, runningThreads:{}, runningMsgId:0, activities:[], queued:0};
let clientThread = localStorage.getItem('sentinel_thread') || '';
let commands = [];
let appVersion = '';
let changelogData = [];
let meInfo = {};
let sortBy = localStorage.getItem('sentinel_sort') || 'recent';
let enterToSend = localStorage.getItem('sentinel_enter_send') !== '0';
let fontSize = localStorage.getItem('sentinel_font_size') || '15';
let actExpanded = localStorage.getItem('sentinel_act_expanded') === '1';
let notifyBg = localStorage.getItem('sentinel_notify') === '1';
let settingsTab = 'general';
let showArchived = false;
let cmdIdx = 0;
let cmdFiltered = [];
let pendingJumpMsg = null;
const streamBuf = {};    // msgID -> accumulated delta text
const streamThread = {}; // msgID -> thread id
const pending = [];      // uploads waiting to be sent
let elapsedStart = 0, toastT = null, searchT = null;
let sseState = 'connecting';
let currentMsgs = [];
const msgStore = {};

function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function fmtSize(n){ if(n<1024)return n+' B'; if(n<1048576)return (n/1024).toFixed(1)+' KB'; return (n/1048576).toFixed(1)+' MB'; }
function fmtDur(ms){ if(!ms||ms<0)return ''; if(ms<1000)return ms+'ms'; return (ms/1000).toFixed(1)+'s'; }
function ago(ts){ const d=Date.now()/1000-ts; if(d<60)return 'now'; if(d<3600)return Math.floor(d/60)+'m'; if(d<86400)return Math.floor(d/3600)+'h'; return Math.floor(d/86400)+'d'; }
function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),3500); }
function api(path,body){ return fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body||{})}); }

/* syntax highlighting & code blocks */
const LANG_EXT = {go:'go',python:'py',py:'py',javascript:'js',js:'js',typescript:'ts',ts:'ts',bash:'sh',sh:'sh',zsh:'sh',json:'json',yaml:'yml',yml:'yml',sql:'sql',html:'html',css:'css',rust:'rs',rs:'rs',markdown:'md',md:'md'};
const KW_RE = /\b(func|return|if|else|for|range|switch|case|default|break|continue|struct|interface|type|package|import|var|const|defer|go|select|chan|map|def|class|async|await|try|except|finally|with|as|from|import|lambda|yield|let|function|export|true|false|null|nil|None|True|False|SELECT|FROM|WHERE|INSERT|UPDATE|DELETE|JOIN|CREATE|TABLE)\b/g;

function highlightCode(raw){
  // Escape first, stash comments/strings/numbers behind placeholders that contain
  // no word characters (tokens were digits, so highlighting then re-scanned its own
  // span attributes and produced broken markup), then highlight keywords on the rest.
  const tokens = [];
  const stash = (content, cls) => {   // private-use placeholders hold up to 6143 tokens
    if(tokens.length >= 6143) return content;
    tokens.push('<span class="' + cls + '">' + content + '</span>');
    return '\uE000' + String.fromCharCode(0xE100 + tokens.length - 1) + '\uE001';
  };
  let s = esc(raw);
  s = s.replace(/(\/\/[^\n]*|#[^\n]*|\/\*[\s\S]*?\*\/|&quot;(?:\\.|[^&\n])*?&quot;|&#39;(?:\\.|[^&\n])*?&#39;|`[^`\n]*`)/g, m =>
    stash(m, /^(&quot;|&#39;|`)/.test(m) ? 'tok-str' : 'tok-cmt'));
  s = s.replace(/\b(\d+(?:\.\d+)?)\b/g, m => stash(m, 'tok-num'));
  s = s.replace(KW_RE, '<span class="tok-kw">$1</span>');
  return s.replace(/\uE000([\s\S])\uE001/g, (_, c) => tokens[c.charCodeAt(0) - 0xE100]);
}

function renderCodeBlock(block){
  const nl = block.indexOf('\n');
  let lang = 'text', code = block;
  if(nl >= 0){
    const first = block.slice(0, nl).trim();
    if(/^[A-Za-z0-9_+\-]{1,20}$/.test(first)){ lang = first.toLowerCase(); code = block.slice(nl+1); }
  }
  code = code.replace(/\n$/, '');
  const lines = code.split('\n');
  const lnHtml = lines.map((_,i)=>(i+1)).join('\n');
  const id = 'cb_' + Math.random().toString(36).slice(2,9);
  codeStore[id] = {code, lang};
  return '<div class="codeblock" data-cb="'+id+'">'+
    '<div class="codehdr"><span class="codelang">'+esc(lang)+'</span>'+
    '<div class="codebtns"><button class="codebtn" data-copy="'+id+'">Copy</button><button class="codebtn" data-dl="'+id+'">Download</button></div></div>'+
    '<div class="codebody"><div class="codeln">'+lnHtml+'</div><pre><code>'+highlightCode(code)+'</code></pre></div>'+
  '</div>';
}
const codeStore = {};

/* mini markdown */
function renderMD(src){
  const parts = String(src||'').split(/```/);
  let out = '';
  for(let i=0;i<parts.length;i++){
    if(i%2===1){ out += renderCodeBlock(parts[i]); }
    else { out += inlineMD(parts[i]); }
  }
  return out || '<br>';
}
function inlineMD(t){
  t = esc(t);
  t = t.replace(/`([^`\n]+)`/g,'<code>$1</code>');
  t = t.replace(/\*\*([^*\n]+)\*\*/g,'<b>$1</b>');
  t = t.replace(/(^|\s)(https?:\/\/[^\s<)]+)/g,'$1<a href="$2" target="_blank" rel="noopener">$2</a>');
  t = t.replace(/^### (.*)$/gm,'<div class="h">$1</div>');
  t = t.replace(/^##? (.*)$/gm,'<div class="h">$1</div>');
  t = t.replace(/^\s*[-*] (.*)$/gm,'<div class="li">• $1</div>');
  t = t.replace(/\n/g,'<br>');
  return t;
}

/* rendering */
function filesHTML(files){
  return (files||[]).map(f=>{
    const url='/api/file?path='+encodeURIComponent(f.path);
    if(f.kind==='image') return '<a href="'+url+'" target="_blank" rel="noopener"><img class="att-img" loading="lazy" src="'+url+'" alt="'+esc(f.name)+'"></a>';
    if(f.kind==='video') return '<video class="att-video" controls preload="metadata" src="'+url+'"></video><a class="att-file" href="'+url+'" download="'+esc(f.name)+'"><span>🎬</span><span class="fname">'+esc(f.name)+'</span><span class="fsize">'+fmtSize(f.size)+'</span></a>';
    if(f.kind==='audio') return '<audio class="att-audio" controls preload="metadata" src="'+url+'"></audio>';
    return '<a class="att-file" href="'+url+'" download="'+esc(f.name)+'"><span>📄</span><span class="fname">'+esc(f.name)+'</span><span class="fsize">'+fmtSize(f.size)+'</span></a>';
  }).join('');
}
function actIcon(st){ if(st==='running') return '<span class="act-ic run">⟳</span>'; if(st==='error') return '<span class="act-ic err">✕</span>'; return '<span class="act-ic done">✓</span>'; }
function activitiesListHTML(list){
  return (list||[]).map(a=>{
    const dur = a.durationMs ? fmtDur(a.durationMs) : (a.status==='running' && a.startedAt ? fmtDur(Date.now()-a.startedAt) : '');
    return '<div class="act-item">'+actIcon(a.status)+
      '<div class="act-body"><div class="act-name">'+esc(a.name)+'</div>'+
      (a.detail?'<div class="act-detail">'+esc(a.detail)+'</div>':'')+
      (a.error?'<div class="act-err">'+esc(a.error)+'</div>':'')+
      '</div><div class="act-dur">'+esc(dur)+'</div></div>';
  }).join('');
}
function renderActivityPanel(){
  const p = $('#activity-panel');
  const list = S.activities || [];
  if(!S.running && list.length===0){ p.hidden = true; return; }
  if(!S.running || S.runningThread !== S.active){ p.hidden = true; return; }
  p.hidden = false;
  const active = [...list].reverse().find(a=>a.status==='running');
  const title = active ? (active.name + (active.detail ? ' — ' + active.detail : '')) : (list.length ? `${list.length} step(s)` : 'Starting…');
  p.innerHTML = '<div class="act-head" id="act-head">' +
    (S.running?'<span class="act-dot"></span>':'') +
    '<span class="act-title">'+esc(title)+'</span>' +
    '<span class="act-toggle">'+(actExpanded?'Hide':'Details ('+list.length+')')+'</span></div>' +
    (actExpanded && list.length ? '<div class="act-list">'+activitiesListHTML(list)+'</div>' : '');
  $('#act-head').onclick = ()=>{ actExpanded = !actExpanded; renderActivityPanel(); };
}
function bubble(m, streaming){
  const d=document.createElement('div');
  d.className='msg '+(m.role==='user'?'user':m.role==='error'?'error':'assistant');
  d.dataset.id=m.id;
  const b=document.createElement('div'); b.className='bubble';
  const fh=filesHTML(m.files); if(fh) b.innerHTML=fh;
  const t=document.createElement('div'); t.className='txt';
  if(streaming){ t.innerHTML='<span class="raw"></span><span class="cursor"></span>'; }
  else if(m.role==='error'){ t.textContent=m.text; }
  else { t.innerHTML=renderMD(m.text); }
  b.appendChild(t);
  if(!streaming && m.activities && m.activities.length){
    const det = document.createElement('details');
    det.className = 'msg-act';
    det.innerHTML = '<summary>Activity ('+m.activities.length+' step'+(m.activities.length>1?'s':'')+')</summary><div class="act-list">'+activitiesListHTML(m.activities)+'</div>';
    b.appendChild(det);
  }
  const foot=document.createElement('div'); foot.className='msg-foot';
  if(!streaming){
    msgStore[m.id] = m;
    const acts=document.createElement('div'); acts.className='msg-acts';
    if(m.text){
      const cp=document.createElement('button'); cp.className='msg-act-btn'; cp.textContent='Copy'; cp.dataset.msgCopy=m.id;
      acts.appendChild(cp);
    }
    if(m.role==='error'){
      const rt=document.createElement('button'); rt.className='msg-act-btn retry'; rt.textContent='Retry'; rt.dataset.msgRetry=m.id;
      acts.appendChild(rt);
    }
    foot.appendChild(acts);
  }
  const tm=document.createElement('div'); tm.className='time'; tm.style.marginTop='0'; tm.textContent=new Date((m.time||0)*1000).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
  foot.appendChild(tm);
  b.appendChild(foot);
  d.appendChild(b);
  return d;
}
function nearBottom(){ return msgs.scrollTop+msgs.clientHeight >= msgs.scrollHeight-140; }
function scrollIfNear(force){ if(force||nearBottom()) msgs.scrollTop=msgs.scrollHeight; }
function renderEmpty(){
  let e=$('#empty');
  const show = msgs.children.length===0;
  if(show && !e){
    e=document.createElement('div'); e.id='empty';
    e.innerHTML='Say hi — <b>Sentinel</b> is your Hermes agent in the browser.<br>'+
      'Type <b>/</b> for commands<span class="desktop-only"> or <b>Ctrl+K</b> to search conversations</span><span class="mobile-only">, or tap 🔍 to search</span>.<br>'+
      'Attach files or photos with 📎 — she can send files back too.';
    msgs.appendChild(e);
  } else if(!show && e){ e.remove(); }
}

/* threads + management */
function sortThreads(list){
  return [...list].sort((a,b)=>{
    if(!!a.pinned !== !!b.pinned) return a.pinned ? -1 : 1;
    const ka = sortBy==='created' ? (a.created||0) : (a.lastTime||a.created||0);
    const kb = sortBy==='created' ? (b.created||0) : (b.lastTime||b.created||0);
    return kb - ka;
  });
}
let openMenu = null;
function closeThreadMenu(){ if(openMenu){ openMenu.remove(); openMenu = null; } }
function exportThread(id, format){
  const tid = id || S.active;
  const fmt = (format || 'md').toLowerCase();
  if(!['md','json','txt'].includes(fmt)){ toast('Use format: md, json, or txt'); return; }
  const a = document.createElement('a');
  a.href = '/api/export?thread='+encodeURIComponent(tid)+'&format='+encodeURIComponent(fmt);
  a.download = '';
  a.click();
}
function switchThread(id){
  if(!id) return;
  clientThread = id;
  localStorage.setItem('sentinel_thread', id);
  fetch('/api/state?thread='+encodeURIComponent(id)).then(r=>r.json()).then(applySnap).catch(()=>{});
}
function showThreadMenu(t, btn){
  closeThreadMenu();
  const r = btn.getBoundingClientRect();
  const m = document.createElement('div');
  m.className = 'tmenu';
  m.style.top = Math.min(r.bottom + 4, innerHeight - 230) + 'px';
  m.style.left = Math.min(r.left - 110, innerWidth - 165) + 'px';
  const items = [
    [t.pinned ? 'Unpin' : 'Pin to top', () => api('/api/thread/pin', {id:t.id, pinned:!t.pinned})],
    ['Rename', () => openRenameModal(t)],
    ['Export (.md)', () => exportThread(t.id, 'md')],

    b.textContent = label;

}
function threadRow(t){

function renderThreads(){

function ensureStream(id){
  let el=msgs.querySelector('.msg[data-id="'+id+'"]');
  if(!el){
    el=bubble({id,role:'assistant',text:'',files:[],time:Math.floor(Date.now()/1000)},true);
    msgs.appendChild(el);
  }
  return el;
}
function renderMessages(list){
  currentMsgs = list || [];
  msgs.innerHTML='';
  for(const m of currentMsgs) msgs.appendChild(bubble(m,false));
  for(const id of Object.keys(streamBuf)){
    if(streamThread[id]===S.active){
      const el=ensureStream(id);
      el.querySelector('.raw').textContent=streamBuf[id];
    }
  }
  renderEmpty();
  if(pendingJumpMsg){
    const target = msgs.querySelector('.msg[data-id="'+pendingJumpMsg+'"]');

    if(target){
      target.scrollIntoView({behavior:'smooth', block:'center'});

      setTimeout(()=>target.classList.remove('jump-hit'), 2200);

/* state events */
function applySnap(d){
  const list = d.threads || [];
  if(clientThread && d.active !== clientThread && list.some(t=>t.id===clientThread)){
    fetch('/api/state?thread='+encodeURIComponent(clientThread)).then(r=>r.json()).then(applySnap).catch(()=>{});
    return;
  }
  const wasRunning=S.running;
  S.threads=list; S.active=d.active;
  if(S.active){ clientThread=S.active; localStorage.setItem('sentinel_thread', clientThread); }
  const rt = {};
  (d.runningThreads||[]).forEach(id=>{ rt[id]=true; });
  if(d.running && d.runningThread) rt[d.runningThread]=true;
  S.runningThreads = rt;
  S.running=!!d.running; S.runningThread=d.runningThread; S.runningMsgId=d.runningMsgId||0;
  S.activities=d.activities||[]; S.queued=d.queued||0;
  if(S.running && S.runningMsgId && S.runningThread){
    streamThread[S.runningMsgId] = S.runningThread;
    if(d.runningText && (!streamBuf[S.runningMsgId] || d.runningText.length > streamBuf[S.runningMsgId].length)){
      streamBuf[S.runningMsgId] = d.runningText;
    }
  }
  if(!wasRunning&&S.running) elapsedStart=Date.now();
  renderThreads();
  renderMessages(d.messages||[]);
  renderActivityPanel();
  updateStatus();
  const actThr = S.threads.find(t=>t.id===S.active);
  $('#model-pill').textContent = (actThr && actThr.model) ? actThr.model : 'default';
}
function onMsg(d){
  delete streamBuf[d.message.id]; delete streamThread[d.message.id];
  if(notifyBg && document.hidden && d.message.role!=='user' && 'Notification' in window && Notification.permission==='granted'){
    try{ new Notification(d.message.role==='error'?'Sentinel Error':'Sentinel Reply', {body:(d.message.text||'').slice(0,120)}); }catch(_){}
  }
  if(d.thread!==S.active) return;
  currentMsgs.push(d.message);
  const nb=bubble(d.message,false);
  const el=msgs.querySelector('.msg[data-id="'+d.message.id+'"]');
  if(el) el.replaceWith(nb); else msgs.appendChild(nb);
  renderEmpty();
  scrollIfNear(true);
}
function onDelta(d){
  streamBuf[d.id]=(streamBuf[d.id]||'')+d.text;
  streamThread[d.id]=d.thread;
  if(d.thread!==S.active) return;
  const el=ensureStream(d.id);
  el.querySelector('.raw').textContent+=d.text;
  scrollIfNear();
}
function onActivity(d){
  if(d.thread===S.active){ S.activities = d.activities||[]; renderActivityPanel(); }
}
function onStatus(d){
  if(d.thread){
    if(d.running) S.runningThreads[d.thread] = true;
    else delete S.runningThreads[d.thread];
  }
  if(!d.thread || d.thread === S.active){
    const wasRunning = S.running;
    S.running = !!d.running;
    S.runningThread = d.running ? (d.thread || S.active) : '';
    S.runningMsgId = d.msgId || 0;
    S.queued = d.queued || 0;
    if(!S.running) S.activities = [];
    if(!wasRunning && S.running) elapsedStart = Date.now();
    renderActivityPanel();
    updateStatus();
  }
  renderThreads();
}
function updateStatus(){
  const st=$('#status'), stop=$('#stopbtn');
  const activeRunning = S.running && S.runningThread === S.active;
  // Header space is only tight while THIS thread is running; a run in another
  // thread must not hide the search/settings buttons.
  document.body.classList.toggle('is-running', activeRunning);
  if(sseState==='expired'){
    st.textContent='session expired — reload to sign in';
    st.classList.remove('busy');
    $('#elapsed').textContent='';
    stop.hidden=true;
    return;
  }
  if(sseState==='reconnecting'){
    st.textContent='reconnecting…';
    st.classList.add('busy');
    stop.hidden=!activeRunning;
    return;
  }
  if(activeRunning){
    st.textContent='thinking…'+(S.queued>0?' ('+S.queued+' queued)':'');
    st.classList.add('busy');
    $('#elapsed').textContent=Math.floor((Date.now()-elapsedStart)/1000)+'s';
    stop.hidden=false;
  } else {
    st.textContent='online'; st.classList.remove('busy');
    $('#elapsed').textContent=''; stop.hidden=true;
  }
}
setInterval(()=>{
  if(S.running && S.runningThread === S.active){
    $('#elapsed').textContent=Math.floor((Date.now()-elapsedStart)/1000)+'s';
    if(actExpanded) renderActivityPanel();
  }
},1000);

/* SSE */
function connect(){
  const es=new EventSource('/api/events');
  es.onopen=()=>{ sseState='online'; updateStatus(); };
  es.onerror=()=>{
    sseState='reconnecting'; updateStatus();
    fetch('/api/me').then(r=>{ if(r.status===401){ sseState='expired'; updateStatus(); toast('Session expired — reload to sign in'); es.close(); } }).catch(()=>{});
  };
  es.addEventListener('snapshot',e=>applySnap(JSON.parse(e.data)));
  es.addEventListener('msg',     e=>onMsg(JSON.parse(e.data)));
  es.addEventListener('delta',   e=>onDelta(JSON.parse(e.data)));
  es.addEventListener('activity',e=>onActivity(JSON.parse(e.data)));
  es.addEventListener('status',  e=>onStatus(JSON.parse(e.data)));
}

/* search */
function highlightTerm(text, q){
  const safe = esc(text);
  if(!q) return safe;
  const re = new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','ig');
  return safe.replace(re, '<mark>$1</mark>');
}
function openSearchModal(initialQ){
  openModal('search-modal');
  const inp = $('#search-in');
  inp.value = initialQ || '';
  inp.focus();
  runSearch(inp.value);
}
async function runSearch(q){
  const resEl = $('#search-res');
  q = q.trim();
  if(!q){ resEl.innerHTML='<div style="color:var(--dim);font-size:13px;padding:8px 2px">Type to search across all thread titles and messages.</div>'; return; }
  try{
    const r = await fetch('/api/search?q='+encodeURIComponent(q));
    const d = await r.json();
    const hits = d.hits || [];
    if(!hits.length){ resEl.innerHTML='<div style="color:var(--dim);font-size:13px;padding:8px 2px">No matches found.</div>'; return; }
    resEl.innerHTML = '';
    for(const h of hits){
      const el = document.createElement('div');
      el.className = 'shit';
      el.innerHTML = '<div class="shit-top"><span class="shit-title">'+highlightTerm(h.threadTitle, q)+(h.archived?' (archived)':'')+'</span><span>'+ago(h.time)+'</span></div>'+
        '<div class="shit-snip">'+highlightTerm(h.snippet, q)+'</div>';
      el.onclick = () => {
        closeModal('search-modal');
        if(h.msgId) pendingJumpMsg = h.msgId;
        if(h.threadId === S.active && h.msgId){
          const target = msgs.querySelector('.msg[data-id="'+h.msgId+'"]');
          if(target){
            pendingJumpMsg = null;
            target.scrollIntoView({behavior:'smooth', block:'center'});
            target.classList.add('jump-hit');
            setTimeout(()=>target.classList.remove('jump-hit'), 2200);
          }
        } else {
          switchThread(h.threadId);
        }
      };
      resEl.appendChild(el);
    }
  }catch(_){}
}
$('#search-in').addEventListener('input', e => {
  clearTimeout(searchT);
  searchT = setTimeout(() => runSearch(e.target.value), 120);
});

/* slash command autocomplete */
function updateCmdPopup(){
  const val = $('#input').value;
  const pop = $('#cmd-popup');
  if(!val.startsWith('/') || val.includes('\n') || val.includes(' ')){
    pop.hidden = true; cmdFiltered = []; return;
  }
  const q = val.toLowerCase();
  cmdFiltered = commands.filter(c => c.name.startsWith(q));
  if(!cmdFiltered.length){ pop.hidden = true; return; }
  if(cmdIdx >= cmdFiltered.length) cmdIdx = 0;
  pop.hidden = false;
  pop.innerHTML = cmdFiltered.map((c,i) =>
    '<div class="cmd-item'+(i===cmdIdx?' sel':'')+'" data-i="'+i+'">'+
      '<div class="cmd-left"><span class="cmd-usage">'+esc(c.usage)+'</span></div>'+
      '<span class="cmd-desc">'+esc(c.description)+'</span>'+
    '</div>'
  ).join('');
  pop.querySelectorAll('.cmd-item').forEach(el => {
    el.onclick = () => selectCommand(cmdFiltered[Number(el.dataset.i)]);
  });
}
function selectCommand(c){
  if(!c) return;
  $('#cmd-popup').hidden = true;
  if(c.takesArgs){
    $('#input').value = c.name + ' ';
    autosize();
    $('#input').focus();
  } else {
    $('#input').value = '';
    autosize();
    execSlashCommand(c.name, '');
  }
}
function execSlashCommand(cmd, arg){
  switch(cmd){
    case '/new': newChat(); return true;
    case '/help': openHelpModal(); return true;
    case '/clear': api('/api/thread/clear', {id:S.active}); return true;
    case '/rename':
      if(arg) api('/api/thread/rename', {id:S.active, title:arg});
      else openRenameModal();
      return true;
    case '/search': openSearchModal(arg); return true;
    case '/archive': api('/api/thread/archive', {id:S.active, archived:true}); return true;
    case '/stop': api('/api/stop', {thread:S.active}); return true;
    case '/export': exportThread(S.active, arg||'md'); return true;
    case '/model':
      if(arg) setThreadModel(arg);
      else openModelModal();
      return true;
    case '/update': runUpdate(); return true;
    case '/settings': openSettingsModal('general'); return true;
  }
  return false;
}

/* /update: pull + rebuild + restart Sentinel, then reload once it is back */
async function runUpdate(){
  toast('/update: checking origin…');
  let d = {};
  try{
    const r = await fetch('/api/update', {method:'POST'});
    d = await r.json().catch(()=>({}));
    if(!r.ok && !d.message) d.message = 'update failed: HTTP '+r.status;
  }catch(e){ toast('/update failed: '+e); return; }
  toast(d.message || (d.ok ? 'updated' : 'update failed'));
  if(d.restarted) waitForRestart();
}
function waitForRestart(){
  let tries = 0;
  const t = setInterval(async () => {
    tries++;
    try{
      const r = await fetch('/healthz', {cache:'no-store'});
      if(r.ok){ clearInterval(t); location.reload(); return; }
    }catch(_){}
    if(tries >= 60){ clearInterval(t); toast('Sentinel is taking a while to come back — reload when it does'); }
  }, 1000);
}

/* composer */
function autosize(){ const el=$('#input'); el.style.height='auto'; el.style.height=Math.min(el.scrollHeight,160)+'px'; }
function renderChips(){
  const c=$('#chips'); c.innerHTML='';
  pending.forEach((f,i)=>{
    const d=document.createElement('div'); d.className='chip';
    d.innerHTML=(f.url?'<img src="'+f.url+'">':'<span>📄</span>')+'<span class="cn">'+esc(f.name)+'</span>';
    const x=document.createElement('button'); x.textContent='×';
    x.onclick=()=>{ pending.splice(i,1); renderChips(); };
    d.appendChild(x); c.appendChild(d);
  });
}
function setSidebar(open){
  $('#sidebar').classList.toggle('open', !!open);
  $('#backdrop').classList.toggle('show', !!open);
}
function newChat(){
  clientThread = '';
  localStorage.removeItem('sentinel_thread');
  api('/api/new');
  if(isNarrow()) setSidebar(false);
}
function send(){
  const el=$('#input'); const text=el.value.trim();
  if(text.startsWith('/')){
    const sp = text.indexOf(' ');
    const cmd = (sp<0 ? text : text.slice(0,sp)).toLowerCase();
    const arg = sp<0 ? '' : text.slice(sp+1).trim();
    if(execSlashCommand(cmd, arg)){
      el.value=''; autosize(); $('#cmd-popup').hidden=true; return;
    }
  }
  if(!text && !pending.length) return;
  const files=pending.map(f=>({path:f.path,name:f.name}));
  pending.length=0; renderChips();
  el.value=''; autosize(); $('#cmd-popup').hidden=true;
  api('/api/send',{thread:S.active,text,files}).then(r=>{ if(!r.ok) r.text().then(t=>toast('send failed: '+t)); })
    .catch(e=>toast('send failed: '+e));
}

/* events */
$('#send').onclick=send;
$('#input').addEventListener('keydown',e=>{
  const pop = $('#cmd-popup');
  if(!pop.hidden && cmdFiltered.length){
    if(e.key==='ArrowDown'){ e.preventDefault(); cmdIdx=(cmdIdx+1)%cmdFiltered.length; updateCmdPopup(); return; }
    if(e.key==='ArrowUp'){ e.preventDefault(); cmdIdx=(cmdIdx-1+cmdFiltered.length)%cmdFiltered.length; updateCmdPopup(); return; }
    if(e.key==='Tab' || (e.key==='Enter' && !e.shiftKey)){ e.preventDefault(); selectCommand(cmdFiltered[cmdIdx]); return; }
    if(e.key==='Escape'){ e.preventDefault(); pop.hidden=true; return; }
  }
  const sendCombo = enterToSend ? (e.key==='Enter' && !e.shiftKey) : (e.key==='Enter' && (e.ctrlKey||e.metaKey));
  if(sendCombo){ e.preventDefault(); send(); }
});
$('#input').addEventListener('input',()=>{ autosize(); cmdIdx=0; updateCmdPopup(); });

  renderThreads();
};

$('#hdr-search').onclick=()=>openSearchModal('');
$('#hdr-settings').onclick=()=>openSettingsModal('general');
$('#settings-btn').onclick=()=>openSettingsModal('general');
$('#ver-badge').onclick=()=>openSettingsModal('changelog');

async function uploadFiles(fileList){
  if(!fileList || !fileList.length) return;
  for(const f of fileList){
    const fd=new FormData(); fd.append('file',f);
    try{
      const r=await fetch('/api/upload',{method:'POST',body:fd});
      if(!r.ok) throw new Error(await r.text());
      const d=await r.json();
      d.files.forEach(a=>pending.push({...a,url:(a.kind==='image')?URL.createObjectURL(f):null}));
    }catch(err){ toast('upload failed: '+err); }
  }
  renderChips();
}
$('#file').addEventListener('change',async e=>{
  await uploadFiles(e.target.files);
  e.target.value='';
});
$('#input').addEventListener('paste', e=>{
  const files = e.clipboardData && e.clipboardData.files;
  if(files && files.length){ e.preventDefault(); uploadFiles(files); }
});
const mainEl = document.querySelector('main');
let dragDepth = 0;
if(!isTouch){
mainEl.addEventListener('dragenter', e=>{
  if(e.dataTransfer && Array.from(e.dataTransfer.types||[]).includes('Files')){
    e.preventDefault(); dragDepth++; mainEl.classList.add('drop-active');
  }
});
mainEl.addEventListener('dragover', e=>{
  if(e.dataTransfer && Array.from(e.dataTransfer.types||[]).includes('Files')) e.preventDefault();
});
mainEl.addEventListener('dragleave', ()=>{
  dragDepth = Math.max(0, dragDepth-1);
  if(dragDepth===0) mainEl.classList.remove('drop-active');
});
mainEl.addEventListener('drop', e=>{
  dragDepth = 0; mainEl.classList.remove('drop-active');
  const files = e.dataTransfer && e.dataTransfer.files;
  if(files && files.length){ e.preventDefault(); uploadFiles(files); }
});
}

msgs.addEventListener('click', e => {
  const mcp = e.target.closest('[data-msg-copy]');
  if(mcp){
    const m = msgStore[mcp.dataset.msgCopy];
    if(m && m.text && navigator.clipboard){
      navigator.clipboard.writeText(m.text).then(()=>{
        mcp.textContent='Copied'; setTimeout(()=>mcp.textContent='Copy',1500);
      });
    }
    return;
  }
  const mrt = e.target.closest('[data-msg-retry]');
  if(mrt){
    const errId = Number(mrt.dataset.msgRetry);
    const idx = currentMsgs.findIndex(x=>x.id===errId);
    let prevUser = null;
    for(let i=(idx<0?currentMsgs.length-1:idx-1); i>=0; i--){
      if(currentMsgs[i].role==='user'){ prevUser = currentMsgs[i]; break; }
    }
    if(!prevUser){ toast('Nothing to retry'); return; }
    const files = (prevUser.files||[]).map(f=>({path:f.path,name:f.name}));
    api('/api/send',{thread:S.active, text:prevUser.text, files}).then(r=>{ if(!r.ok) r.text().then(t=>toast('retry failed: '+t)); })
      .catch(err=>toast('retry failed: '+err));
    return;
  }
  const cp = e.target.closest('[data-copy]');
  if(cp){
    const item = codeStore[cp.dataset.copy];
    if(item && navigator.clipboard){
      navigator.clipboard.writeText(item.code).then(()=>{
        cp.textContent='Copied'; setTimeout(()=>cp.textContent='Copy',1500);
      });
    }
    return;
  }
  const dl = e.target.closest('[data-dl]');
  if(dl){
    const item = codeStore[dl.dataset.dl];
    if(item){
      const ext = LANG_EXT[item.lang] || 'txt';
      const blob = new Blob([item.code], {type:'text/plain;charset=utf-8'});
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'snippet.'+ext;
      a.click();
      setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
    }
  }
});

document.addEventListener('click', () => closeThreadMenu());
window.addEventListener('keydown', e => {
  if(hasKeyboard && (e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='k'){
    e.preventDefault();
    openSearchModal('');
  } else if(e.key==='Escape'){
    closeThreadMenu();
    setSidebar(false);
    if(!$('#whatsnew-modal').hidden) markChangelogSeen();
    ['search-modal','help-modal','prompt-modal','confirm-modal','settings-modal','whatsnew-modal','model-modal'].forEach(closeModal);
    $('#cmd-popup').hidden = true;
  }
});

fetch('/api/commands').then(r=>r.json()).then(d=>{ commands=d.commands||[]; }).catch(()=>{});

connect();
if(new URLSearchParams(location.search).get('new')==='1'){
  history.replaceState(null,'','/');
  api('/api/new');
}
if(hasKeyboard) $('#input').focus();

/* mobile: keyboard-aware height, draft scroll, edge-swipe drawer */
function fitAppHeight(){
  if(!isTouch || !window.visualViewport) return;
  document.documentElement.style.setProperty('--app-h', Math.round(window.visualViewport.height)+'px');
}
if(isTouch){
  if(window.visualViewport){
    const vv = window.visualViewport;
    vv.addEventListener('resize', ()=>{ fitAppHeight(); if(document.activeElement===$('#input')) scrollIfNear(true); });
    vv.addEventListener('scroll', fitAppHeight);
    fitAppHeight();
  }
  $('#searchbtn').title = 'Search conversations';
  $('#input').placeholder = 'Message Sentinel…';
  $('#input').addEventListener('focus', ()=>setTimeout(()=>scrollIfNear(true), 250));
  let swipe = null;
  document.addEventListener('touchstart', e => {
    if(!isNarrow() || e.touches.length!==1 || document.querySelector('.modal-bg:not([hidden])')){ swipe=null; return; }
    const t = e.touches[0];
    swipe = {x:t.clientX, y:t.clientY, open:$('#sidebar').classList.contains('open'), done:false};
  }, {passive:true});
  document.addEventListener('touchmove', e => {
    if(!swipe || swipe.done || e.touches.length!==1) return;
    const t = e.touches[0], dx = t.clientX-swipe.x, dy = t.clientY-swipe.y;
    if(Math.abs(dy) > Math.abs(dx)){ if(Math.abs(dy) > 16) swipe=null; return; }
    if(!swipe.open && swipe.x < 24 && dx > 48){ swipe.done=true; setSidebar(true); }
    else if(swipe.open && dx < -48){ swipe.done=true; setSidebar(false); }
  }, {passive:true});
  document.addEventListener('touchend', ()=>{ swipe=null; }, {passive:true});
}
if ('serviceWorker' in navigator) {
  addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(()=>{}));
}
